server {
    listen 443 ssl;
    server_name xcap.FULLDOMAIN;

    root /usr/share/nginx/html;
    index index.html;
    ssl_certificate /etc/letsencrypt/live/FULLDOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/FULLDOMAIN/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;

    location / {
        proxy_pass http://host.docker.internal:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}
server {
    listen 443 ssl;
    server_name FULLDOMAIN;

    root /usr/share/nginx/html;
    index index.html;
    ssl_certificate /etc/letsencrypt/live/FULLDOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/FULLDOMAIN/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;

    location / {
        try_files $uri /index.html;
    }

    # Admin/management UI + API → Sylk Server built-in web server
    # (active when http(s)_management_interface = builtin_webserver in
    # webrtcgateway.ini). The exact-match redirect adds the trailing
    # slash here in nginx, so the backend never issues its own redirect
    # (which would leak the internal :10888 port in the Location header).
    location = /webrtcgateway/admin {
        return 301 /webrtcgateway/admin/;
    }

    location /webrtcgateway/admin/ {
        proxy_pass https://sylkserver:10888/webrtcgateway/admin/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # /rooms/events is Server-Sent Events: disable buffering and
        # allow long-lived connections
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    # WebSocket → Sylk Server
    location /ws {
        proxy_pass https://sylkserver:10888/webrtcgateway/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    location /filesharing {
        proxy_pass https://sylkserver:10888/webrtcgateway/filesharing;
        proxy_http_version 1.1;
        client_max_body_size 200M;
        proxy_set_header Host $host;
    }

    location /filetransfer {
        proxy_pass https://sylkserver:10888/webrtcgateway/filetransfer;
        proxy_http_version 1.1;
        client_max_body_size 200M;
#        proxy_buffering off;
        proxy_set_header Host $host;
    }

    location /webrtcgateway/filetransfer {
        proxy_pass https://sylkserver:10888/webrtcgateway/filetransfer;
        proxy_http_version 1.1;
        client_max_body_size 200M;
#        proxy_buffering off;
        proxy_set_header Host $host;
    }

    location /enrollment {
        proxy_pass http://host.docker.internal:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}
