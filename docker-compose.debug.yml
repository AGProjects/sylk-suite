# Debug override for sylkserver — run the source tree from
# /home/agp/work/sylkserver in the foreground, on top of the production
# installation under /opt/sylk-suite.
#
# Normally invoked via /opt/sylk-suite/scripts/docker-up-debug.sh
# (manual equivalent, ON THE SERVER):
#   cd /opt/sylk-suite
#   sudo docker-compose --env-file logs/docker.env stop sylkserver
#   sudo docker-compose --ansi never --env-file logs/docker.env \
#       -f docker-compose.yml -f /home/agp/work/sylk-suite/docker-compose.debug.yml \
#       up --no-deps --no-log-prefix sylkserver
#
# Base config, docker.env, network, tls volume and /opt/sylk-suite/sylkserver/config
# all come from the production tree; only the CODE comes from ~agp/work.
#
# Edit code on the mac -> sync to the server -> Ctrl+C and run again.
# No image rebuild needed.
#
# Extra tricks while it runs:
#   docker kill -s USR1 sylkserver   # toggle DEBUG log level live
#   docker kill -s USR2 sylkserver   # dump notification observers

services:
  sylkserver:
    restart: "no"
    volumes:
      # code: the work tree, mounted over the deb-installed package
      - /home/agp/work/sylkserver/sylk:/usr/lib/python3/dist-packages/sylk
      - /home/agp/work/sylkserver/sylk-server:/usr/bin/sylk-server
      # entrypoint from the work tree, so you can add --debug to the exec
      # line without rebuilding or touching /opt:
      - /home/agp/work/sylk-suite/sylkserver/entrypoint.sh:/usr/local/bin/entrypoint.sh
